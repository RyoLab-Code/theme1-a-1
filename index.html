<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同志社学内MAP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="logo-box" aria-label="同志社ロゴ">同志社</div>

      <div class="school-name">
        <div class="school-sub">同志社大学</div>
        <div class="school-main">京田辺キャンパス</div>

      <div class="search-wrap">
        <input id="search" type="text" placeholder="検索したい建物の名前" />

    <main class="content">
      <h1>同志社学内MAP</h1>

      <div class="campus-image">
        <img src="京田辺キャンパス.jpg" alt="京田辺キャンパスの画像" />

    </main>

    <script src="app.js"></script>

</html>
